# CI（08 §4）：M1 仅 test job；build/package matrix 随 M4 打包任务接入
# 全链四阶段与 build/build.sh 同序（build → export-ts → pnpm build → test），本地仍以
# build.sh 为单一入口；CI 侧拆为独立 step——任一阶段红即一眼定位到环（整段式
# "Build & Test" 一次红无法区分失败环节，2026-10-11 run#5 排障实录）。
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 防真挂起烧满默认 360 分钟额度（全链绿跑 ≈5 分钟，余量充足）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable pnpm

      - name: dotnet build（08 §2）
        run: dotnet build AI-P2P.sln -c Release

      # export-ts：反射导出 API 类型 → ui-shared/types/api.d.ts（06 §5，M1-31 落地生成器）
      - name: export-ts 类型导出（06 §5、M1-31）
        run: dotnet run --project src/Tools/ExportTs -c Release

      # 前端：显式 frozen-lockfile 安装（此前依赖 pnpm 跑脚本前的自动补装，行为隐式；
      # 锁文件不同步时 CI 立即红，而非静默按最新解析）→ workspace 构建产物直写两宿主 wwwroot
      - name: 前端 pnpm install + build（08 §2）
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web --filter @p2p/client-app --filter @p2p/server-app build

      # 串行跑五套件（2026-10-26 实弹回流：单条 sln 命令=五测试进程并发挤占 2 核 runner，
      # 信令推送调度长尾家族再现——StatsTests.PunchResult_Direct 0x71 静默 30s 击穿（302/303 过、
      # 本地全绿，与 5b5a9c3 定性同族）；亦对齐任务清单留档口径「同机跑多轮测试套须串行——
      # UdpNatSimulator/TcpStunStub 绑死 3478 跨进程必撞」。每套件独立 TRX：旧单名共享被
      # 末个项目覆盖（当日 run 日志 3 次 Overwriting 实证，失败现场随覆盖丢失）；Integration
      # 最长（~3.5min）殿后，总时长 ≈ 串行和 ≈ 4.5min 仍远低于 job 20min 预算。
      - name: dotnet test 全仓（串行，08 §2）
        run: |
          for proj in Core Nic Client Server Integration; do
            echo "== P2P.$proj.Tests =="
            dotnet test "tests/P2P.$proj.Tests" -c Release --no-build \
              --logger "trx;LogFileName=$proj.trx" --results-directory "test-results/$proj"
          done

      # 失败自助排障（2026-10-24）：TRX 解析失败用例 → ::error 注解（注解经匿名 API 可读——
      # 当日连续多轮 CI 失败仅凭 job 日志排障需人工转贴，注解携带用例名+消息后免转贴）
      - name: 失败用例提取 → CI 注解
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re, html
          seen = set()
          for f in glob.glob('test-results/**/*.trx', recursive=True):
              t = open(f, encoding='utf-8').read()
              for m in re.finditer(r'<UnitTestResult[^>]*testName="([^"]+)"[^>]*outcome="Failed"[^>]*>(.*?)</UnitTestResult>', t, re.S):
                  name, body = m.group(1), m.group(2)
                  if name in seen: continue
                  seen.add(name)
                  msg = re.search(r'<Message>(.*?)</Message>', body, re.S)
                  text = html.unescape(msg.group(1)).strip().replace('\n', ' ')[:200] if msg else ''
                  print(f"::error title=测试失败::{name}: {text}")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

      # M1-36：coverlet.collector 的 runsettings Threshold 经两法验证不拦运行
      # （--collect 与 -s 并用仍 0 退出），故门槛为显式解析 cobertura 根 line-rate。
      - name: Core 覆盖率采集 + 门槛 ≥70%（09 §1/AI-28）
        run: |
          dotnet test tests/P2P.Core.Tests -c Release --no-build --collect:"XPlat Code Coverage"
          f=$(ls tests/P2P.Core.Tests/TestResults/*/coverage.cobertura.xml | head -1)
          rate=$(grep -o 'line-rate="[0-9.]*"' "$f" | head -1 | sed 's/[^0-9.]//g')
          awk -v r="$rate" 'BEGIN { printf "Core 行覆盖率 %.2f%%（门槛 70%%）\n", r*100
            if (r < 0.70) { print "低于门槛，CI 失败"; exit 1 }
            print "达标" }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: tests/P2P.Core.Tests/TestResults
